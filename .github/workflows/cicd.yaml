name: Deploy MediQuery.ai

on:
  push:
    branches: [main]

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6 # Updated for Node 24 support
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Updated version

      - name: Build and Push
        # Enabled BuildKit (set to 1) for faster, more reliable builds
        env:
          DOCKER_BUILDKIT: 1 
        run: |
          docker build -t 577435557871.dkr.ecr.eu-north-1.amazonaws.com/medical_chatbot:latest .
          docker push 577435557871.dkr.ecr.eu-north-1.amazonaws.com/medical_chatbot:latest

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted
    steps:
      - name: Configure AWS credentials (Self-Hosted)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2
        run: |
          docker pull 577435557871.dkr.ecr.eu-north-1.amazonaws.com/medical_chatbot:latest
          docker stop mediquery-app || true
          docker rm mediquery-app || true
          docker run -d -p 8080:8080 --name mediquery-app \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            577435557871.dkr.ecr.eu-north-1.amazonaws.com/medical_chatbot:latest